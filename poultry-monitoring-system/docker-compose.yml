# Docker Compose for PostgreSQL + the Django backend (Gunicorn).
# Copy .env.example to .env and set real values before running:
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-poultry}
      POSTGRES_USER: ${DB_USER:-poultry}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-poultry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-poultry}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  web:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py setup_roles &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set a strong secret key}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME:-poultry}
      DB_USER: ${DB_USER:-poultry}
      DB_PASSWORD: ${DB_PASSWORD:-poultry}
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_SECURE_SSL_REDIRECT: "False"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
      - static:/app/staticfiles:ro
    depends_on:
      - web
    ports:
      - "80:80"

volumes:
  pgdata:
  media:
  static:
