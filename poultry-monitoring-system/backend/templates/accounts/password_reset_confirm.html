{% extends "base.html" %}
{% block title %}Set new password{% endblock %}
{% block auth_content %}<div class="auth-wrap"><div class="auth-card">
<div class="brand">Set a new password</div>
{% if validlink %}
<form method="post" novalidate>{% csrf_token %}{% include "partials/_form_fields.html" %}
<button class="btn btn-primary w-100">Set password</button></form>
{% else %}<div class="alert alert-danger">This reset link is invalid or expired.</div>
<a class="btn btn-primary w-100" href="{% url 'accounts:password_reset' %}">Request a new link</a>{% endif %}
</div></div>{% endblock %}
