{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block auth_content %}<div class="auth-wrap"><div class="auth-card">
<div class="brand">Reset password</div>
<p class="subtitle">Enter your email to receive a reset link.</p>
<form method="post" novalidate>{% csrf_token %}{% include "partials/_form_fields.html" %}
<button class="btn btn-primary w-100">Send reset link</button>
<div class="text-center mt-3"><a class="small" href="{% url 'accounts:login' %}">Back to sign in</a></div></form>
</div></div>{% endblock %}
