# Tooling configuration for Ruff (lint) and Black (format).
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",   # line length handled by black
    "B008",   # function call in default arg (DRF/Django patterns)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/settings/*.py" = ["F403", "F405"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"
