# Nginx reverse proxy for the Django/Gunicorn backend.
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location /healthz/ {
        proxy_pass http://django;
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # For HTTPS, terminate TLS here (certbot) and set X-Forwarded-Proto https.
}
